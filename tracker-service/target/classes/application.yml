server:
  port: 8082

spring:
  application:
    name: tracker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/applypilot_db
    username: applypilot
    password: applypilot_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:thisIsADefaultSecretKeyThatShouldBeReplacedInProductionItNeedsToBeLongEnoughForHS256}
