server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/applypilot_db
    username: applypilot
    password: applypilot_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:thisIsADefaultSecretKeyThatShouldBeReplacedInProductionItNeedsToBeLongEnoughForHS256}
  expiration: ${JWT_EXPIRATION:86400000}
