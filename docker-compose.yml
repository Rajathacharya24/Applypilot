version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: applypilot-postgres
    environment:
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot_password
      POSTGRES_DB: applypilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - applypilot-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: applypilot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@applypilot.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - applypilot-network

  redis:
    image: redis:7-alpine
    container_name: applypilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - applypilot-network

volumes:
  postgres_data:
  redis_data:

networks:
  applypilot-network:
    driver: bridge
